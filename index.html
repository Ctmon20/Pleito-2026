<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estatística Eleições 2026 - Painel</title>
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #2b6cb0;
            --background-color: #f7fafc;
            --card-background: #ffffff;
            --text-color: #2d3748;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            padding: 40px 20px; /* Aumentei o padding geral */
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1000px; /* Aumentei a largura máxima do card */
            background: var(--card-background);
            border-radius: 16px; /* Bordas levemente mais arredondadas */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08); /* Sombra mais suave */
            padding: 40px; /* Aumentei o padding interno */
            margin-top: 50px; /* Espaço superior para centralizar */
        }

        header {
            text-align: center;
            margin-bottom: 40px; /* Mais espaço abaixo do cabeçalho */
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 25px;
        }

        h1 {
            font-size: 1.5rem; /* Aumentei o tamanho da fonte do título */
            color: var(--primary-color);
            font-weight: 800;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        h2 {
            font-size: 1.2rem; /* Aumentei o subtítulo */
            color: var(--secondary-color);
            margin-bottom: 15px;
            font-weight: 700;
        }

        .update-timer {
            font-size: 1rem; /* Timer maior */
            color: #718096;
            font-weight: 500;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        /* Lista Principal */
        .tipicidade-list {
            list-style: none;
        }

        .tipicidade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 20px; /* Aumentei o padding dos itens */
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
        }

        .tipicidade-item:last-child {
            border-bottom: none;
        }

        .tipicidade-item:hover {
            background-color: #f8fafc;
        }

        .tipicidade-info {
            font-size: 1.1rem; /* Fonte maior para os itens */
            font-weight: 700;
            color: var(--text-color);
        }

        .btn-detalhes {
            background-color: transparent;
            border: none;
            color: var(--secondary-color);
            font-weight: 700;
            font-size: 1.1rem; /* Botão maior */
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .btn-detalhes:hover {
            background-color: #ebf8ff;
            text-decoration: underline;
        }

        .total-geral {
            margin-top: 35px; /* Mais espaço */
            text-align: right;
            font-weight: 800;
            font-size: 1.1rem; /* Total maior */
            color: var(--primary-color);
        }

        /* Tela de Detalhes */
        .btn-voltar {
            background: none;
            border: none;
            color: var(--secondary-color);
            font-weight: 700;
            font-size: 1.1rem; /* Botão voltar maior */
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
            padding: 10px 0;
        }

        .btn-voltar:hover {
            text-decoration: underline;
        }

        .detail-header-text {
            font-size: 1.3rem;
            color: var(--primary-color);
            font-weight: 800;
            margin-bottom: 20px;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1rem; /* Fonte da tabela maior */
            text-align: left;
            white-space: nowrap;
            background-color: white;
        }

        th, td {
            padding: 16px 14px; /* Células maiores */
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #edf2f7; /* Fundo do cabeçalho da tabela */
            color: var(--primary-color);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .loading, .error {
            text-align: center;
            padding: 60px;
            color: #718096;
            font-size: 1.1rem;
        }

        .error {
            color: #e53e3e;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>2ª SEÇÃO - ESTATÍSTICA E CIÊNCIA APLICADA</h1>
            <h2>ELEIÇÕES 2026</h2>
            <div class="update-timer" id="timer">Atualiza em 3 minutos</div>
        </header>

        <!-- TELA 1: LISTAGEM DE TIPICIDADES -->
        <div id="main-view" class="view active">
            <div id="content-loading" class="loading">Carregando dados...</div>
            <ul id="tipicidade-list" class="tipicidade-list"></ul>
            <div id="total-geral" class="total-geral"></div>
        </div>

        <!-- TELA 2: DETALHES DA TIPICIDADE -->
        <div id="detail-view" class="view">
            <button class="btn-voltar" onclick="voltarParaPrincipal()">&#8592; Voltar</button>
            <h3 id="detail-title" class="detail-header-text">Detalhes</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>OPM</th>
                            <th>Local</th>
                            <th>Status</th>
                            <th>Rel/Elei</th>
                            <th>Hora/Final</th>
                        </tr>
                    </thead>
                    <tbody id="detail-table-body">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
            <div id="detail-total" class="total-geral"></div>
        </div>
    </div>

    <script>
        // COLE AQUI O URL DO SEU APP DA WEB GERADO NO APPS SCRIPT:
        const API_URL = 'https://script.google.com/macros/s/AKfycbwV4Y93dDqcgH-R3oyzHmbl4LpmGvrDE_C0Mad51ZTq-iT85UcUWAAchxwqvt77NT2V/exec';

        let dadosGlobais = [];
        let tempoRestante = 180; // 3 minutos em segundos

        async function carregarDados() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Erro ao acessar os dados.');
                
                dadosGlobais = await response.json();
                renderizarListaPrincipal();
                
                document.getElementById('content-loading').style.display = 'none';
            } catch (error) {
                console.error(error);
                document.getElementById('content-loading').innerHTML = '<span class="error">Erro ao carregar dados. Verifique a URL do Web App no script.</span>';
            }
        }

        function renderizarListaPrincipal() {
            const listaEl = document.getElementById('tipicidade-list');
            listaEl.innerHTML = '';

            // Agrupar por Tipicidade
            const agrupado = {};
            dadosGlobais.forEach(item => {
                if (!agrupado[item.tipicidade]) {
                    agrupado[item.tipicidade] = [];
                }
                agrupado[item.tipicidade].push(item);
            });

            let totalOcorrencias = 0;

            // Ordenar alfabeticamente as chaves (tipicidades) para melhor visualização
            const chavesOrdenadas = Object.keys(agrupado).sort();

            chavesOrdenadas.forEach(tipicidade => {
                const itens = agrupado[tipicidade];
                const qtd = itens.length;
                totalOcorrencias += qtd;

                const li = document.createElement('li');
                li.className = 'tipicidade-item';
                li.innerHTML = `
                    <span class="tipicidade-info">${qtd} ${tipicidade}</span>
                    <button class="btn-detalhes" onclick="abrirDetalhes('${tipicidade.replace(/'/g, "\\'")}')">Detalhes</button>
                `;
                listaEl.appendChild(li);
            });

            document.getElementById('total-geral').innerText = `Total de ${totalOcorrencias} Ocorrência${totalOcorrencias !== 1 ? 's' : ''}`;
        }

        function abrirDetalhes(tipicidade) {
            document.getElementById('main-view').classList.remove('active');
            document.getElementById('detail-view').classList.add('active');
            document.getElementById('detail-title').innerText = `Detalhes - ${tipicidade}`;

            const tbody = document.getElementById('detail-table-body');
            tbody.innerHTML = '';

            const filtrados = dadosGlobais.filter(item => item.tipicidade === tipicidade);

            filtrados.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.opm}</td>
                    <td>${item.local}</td>
                    <td>${item.status}</td>
                    <td>${item.relEleicao}</td>
                    <td>${item.horaFinal}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('detail-total').innerText = `Total ${filtrados.length} Ocorrência${filtrados.length !== 1 ? 's' : ''}`;
        }

        function voltarParaPrincipal() {
            document.getElementById('detail-view').classList.remove('active');
            document.getElementById('main-view').classList.add('active');
        }

        function iniciarTemporizador() {
            setInterval(() => {
                tempoRestante--;
                if (tempoRestante <= 0) {
                    tempoRestante = 180; // Reinicia o timer
                    carregarDados(); // Atualiza os dados
                }
                const minutos = Math.floor(tempoRestante / 60);
                const segundos = tempoRestante % 60;
                document.getElementById('timer').innerText = `Atualiza em ${minutos}m ${segundos < 10 ? '0' : ''}${segundos}s`;
            }, 1000);
        }

        // Inicialização
        carregarDados();
        iniciarTemporizador();
    </script>
</body>
</html>
